name: Release

on:
  push:
    branches: [main]
    # Most pushes to main are release-irrelevant and this workflow no-ops on them. Both real paths
    # touch these files: opening/updating the Version PR needs a changeset, and the publish push is
    # the Version PR merge itself (which deletes the consumed changeset and bumps package.json).
    paths:
      - ".changeset/**"
      - "package.json"

  # A `paths` miss skips silently, so keep a manual trigger to run a release that was filtered out.
  workflow_dispatch:

# Serialize releases; never cancel a publish mid-flight.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write # create tags + GitHub Releases
  pull-requests: write # open/update the "Version Packages" PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # changesets needs full history

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # build-release.sh compiles the binaries with `bun build --compile`; bun must be on PATH.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      # While changesets exist on main → opens/updates the "Version Packages" PR (runs
      # `changeset version`). When none remain (that PR was merged) → runs `publish`, which
      # builds the 5 platform binaries and cuts the `v<version>` GitHub Release.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset version
          publish: bash scripts/release-publish.sh
          createGithubReleases: false # release-publish.sh owns release creation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # changesets/action names the Version PR and its commit statically ("Version Packages") —
      # its `title`/`commit` inputs can't interpolate the computed version. This repo merges by
      # rebase, so the Version *commit message* (not the PR title) is what lands on main; rewrite
      # both to carry the bumped version, e.g. "release: v0.9.0". Runs only in the version phase
      # (a PR was created/updated), never during publish.
      - name: Put the bumped version in the release PR title and commit
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The action force-pushed changeset-release/main; fetch that exact branch (a shallow
          # checkout of main doesn't have it) and reset onto it.
          git fetch --no-tags origin +refs/heads/changeset-release/main:refs/remotes/origin/changeset-release/main
          git checkout -B changeset-release/main origin/changeset-release/main
          version="$(node -p "require('./package.json').version")"
          title="release: v$version"
          git commit --amend -m "$title"
          git push --force-with-lease origin changeset-release/main
          gh pr edit "$PR_NUMBER" --title "$title"
