name: Release

on:
  push:
    branches: [main]

# Serialize releases; never cancel a publish mid-flight.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write # create tags + GitHub Releases
  pull-requests: write # open/update the "Version Packages" PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # changesets needs full history

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # build-release.sh compiles the binaries with `bun build --compile`; bun must be on PATH.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      # While changesets exist on main → opens/updates the "Version Packages" PR (runs
      # `changeset version`). When none remain (that PR was merged) → runs `publish`, which
      # builds the 5 platform binaries and cuts the `v<version>` GitHub Release.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset version
          publish: bash scripts/release-publish.sh
          createGithubReleases: false # release-publish.sh owns release creation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
