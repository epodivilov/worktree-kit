name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the same pull request: a new push makes the
# previous run's result obsolete, and letting it finish only delays feedback.
# On push to main every run must complete, so the branch always has a verified state.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the changeset gate below diffs against main; needs full history

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # A PR that changes versionable code must ship a changeset (WTK-57), so no user-facing change
      # silently drops out of the changelog / version bump. `changeset status --since` exits
      # non-zero when the package changed since main but the PR added no changeset.
      #
      # Escape hatch for release-irrelevant changes (comment/test-only, chore): commit an empty
      # changeset via `pnpm changeset add --empty`.
      #
      # Skipped for the changesets "Version Packages" PR (branch `changeset-release/main`): that PR
      # consumes the changesets, so it legitimately has none and must not be blocked. Also skipped
      # on push to main, where diffing a merged branch against itself is meaningless.
      #
      # Runs last so a missing changeset never masks a failing test. checkout only wires up the PR
      # ref, so materialize origin/main explicitly (via an explicit refspec) before `--since`
      # resolves it — otherwise changesets swallows the error and the gate silently passes.
      - name: Fetch main for the changeset gate
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Changeset gate
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/main
